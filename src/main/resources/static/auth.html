<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Insights - Login & Register</title>
  <link rel="stylesheet" href="css/auth-style.css">
</head>
<body>

<div class="auth-container">
  <h1>Interview Insights</h1>

  <!-- Tabs -->
  <div class="tabs">
    <button id="loginTab" class="tab-button active">Login</button>  <!--Initially highlight this button with blue -->
    <button id="registerTab" class="tab-button">Register</button>
  </div>

  <!-- Login Form -->
  <div id="loginForm" class="form-container active">  <!-- Display this form initially-->
    <h2>Login</h2>
    <form>
      <input type="text" name="rollNumber" placeholder="Roll Number" required>
      <input type="password" id="password" name="password" placeholder="Password"  required>
      <label>
        <input type="checkbox" id="showPass"> Show Password
      </label>

      <button type="submit">Login</button>
    </form>
  </div>
  <!-- Register Form -->
  <div id="registerForm" class="form-container">  <!-- This form is hidden initially -->
    <h2>Register</h2>
    <form>
      <input type="text" name="name" placeholder="Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="text" name="rollNumber" placeholder="Roll Number" required>
      <select id="departmentSelect" name="departmentId" required>
        <option value="">Select Department</option>  <!-- js calls backend and adds department options dynamically -->
      </select>
      <select id="batchSelect" name="batchId" required>
        <option value="">Select Batch</option>  <!-- batches also dynamically loaded -->
      </select>
      <input type="password" name="password" placeholder="Password" required>
      <input type="password" name="confirmPassword" placeholder="Confirm Password" required>
      <button type="submit">Register</button>
    </form>
  </div>

</div>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
