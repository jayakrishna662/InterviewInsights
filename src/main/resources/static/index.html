<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Insights platform</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">

    <div class="logo">
        <a href="/">Interview Insights</a>
    </div>

    <div class="nav-links">

        <a href="/" class="active">Home</a>

        <a href="/companies">Companies</a>
        <a id="loginLink" href="/auth">Login</a>

        <a id="signupLink" href="/auth?tab=signup">Sign Up</a>

        <div id="userInfo" class="user-info" style="display: none;"> <!-- User Info Section (Hidden Initially), When user logs in, JavaScript will show this and display their name-->

            <span class="user-icon">👤</span>

            <span id="welcomeText" style="display: none;"></span>

        </div>

        <button id="logoutBtn" style="display: inline-block;">
            Logout
        </button>

    </div>

</nav>

<div id="content">

    <div class="hero">

        <h1>Learn from Real Interview Experiences</h1>

        <p>
            Explore interview experiences shared by students and prepare confidently for placements.
        </p>

        <div class="hero-buttons">

            <button id="experiencesBtn">
                Browse Experiences
            </button>

            <button id="questionsBtn">
                Explore Questions
            </button>

            <button id="submitExperienceBtn">
                Share Experience
            </button>

        </div>

    </div>

</div>
<script src="js/common.js"></script>
<script src="js/app.js"></script>

</body>
</html>
