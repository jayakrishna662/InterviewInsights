<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Experience</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">

    <div class="logo">
        <a href="/">Interview Insights</a>
    </div>

    <div class="nav-links">

        <a href="/">Home</a>

        <a href="/companies">Companies</a>

        <a id="loginLink" href="/auth">Login</a>

        <a id="signupLink" href="/auth?tab=signup">Sign Up</a>

        <div class="user-info" id="userInfo" style="display: none;">
            <span class="user-icon">👤</span>
            <span id="welcomeText"></span>
        </div>

        <button id="logoutBtn" style="display:none;">
            Logout
        </button>

    </div>

</nav>

<div class="form-container">

    <div class="form-card">

        <h1>Submit Interview Experience</h1>

        <form id="experienceForm">

            <div class="form-group">
                <label for="companySelect">Company</label>

                <select id="companySelect" required>
                    <option value="">Select Company</option>
                </select>
            </div>

            <div class="form-group">
                <label for="interviewYear">Interview Year</label>

                <input
                        type="number"
                        id="interviewYear"
                        placeholder="Example: 2025"
                        required>
            </div>

            <div class="form-group">
                <label for="result">Result</label>

                <select id="result" required>
                    <option value="">Select Result</option>
                    <option value="SELECTED">Selected</option>
                    <option value="REJECTED">Rejected</option>
                </select>
            </div>

            <hr>

            <div class="form-group">
                <label for="aptitudeExperience">
                    Aptitude Experience
                </label>

                <textarea
                        id="aptitudeExperience"
                        rows="4"
                        placeholder="Share your aptitude round experience..."></textarea>
            </div>

            <div class="form-group">
                <label for="codingExperience">
                    Coding Experience
                </label>

                <textarea
                        id="codingExperience"
                        rows="4"
                        placeholder="Share your coding round experience..."></textarea>
            </div>

            <div class="form-group">
                <label for="technicalExperience">
                    Technical Experience
                </label>

                <textarea
                        id="technicalExperience"
                        rows="4"
                        placeholder="Share your technical interview experience..."></textarea>
            </div>

            <div class="form-group">
                <label for="hrExperience">
                    HR Experience
                </label>

                <textarea
                        id="hrExperience"
                        rows="4"
                        placeholder="Share your HR interview experience..."></textarea>
            </div>

            <div class="form-group">
                <label for="gdExperience">
                    GD Experience
                </label>

                <textarea
                        id="gdExperience"
                        rows="4"
                        placeholder="Share your group discussion experience..."></textarea>
            </div>

            <div class="form-group">
                <label for="overallSuggestions">
                    Overall Suggestions
                </label>

                <textarea
                        id="overallSuggestions"
                        rows="4"
                        placeholder="Any suggestions for other students?"></textarea>
            </div>

            <button class="submit-btn" type="submit">
                Submit Experience
            </button>

        </form>

    </div>

</div>

<script src="js/common.js"></script>
<script src="js/submit-experience.js"></script>

</body>
</html>
